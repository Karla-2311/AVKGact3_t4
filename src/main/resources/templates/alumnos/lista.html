<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Alumnos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h2>Alumnos</h2>
  <a th:href="@{/alumnos/nuevo}" class="btn btn-primary mb-3">Nuevo alumno</a>

  <table class="table table-bordered">
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Matrícula</th>
      <th>Escuela</th>
      <th>Acciones</th>
    </tr>
    <tr th:each="a : ${alumnos}">
      <td th:text="${a.id}"></td>
      <td th:text="${a.nombre}"></td>
      <td th:text="${a.matricula}"></td>
      <td th:text="${a.escuela.nombre}"></td>
      <td>
        <a th:href="@{/alumnos/editar/{id}(id=${a.id})}" class="btn btn-sm btn-warning">Editar</a>
        <a th:href="@{/alumnos/eliminar/{id}(id=${a.id})}" class="btn btn-sm btn-danger">Eliminar</a>
      </td>
    </tr>
  </table>
</div>
</body>
</html>
